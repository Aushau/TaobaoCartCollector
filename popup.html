<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 420px; max-height: 600px; font: 13px/1.4 -apple-system, sans-serif; overflow: hidden; display: flex; flex-direction: column; }
    .tabs { display: flex; border-bottom: 1px solid #e0e0e0; background: #f5f5f5; }
    .tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; font-size: 13px; color: #666; border-bottom: 2px solid transparent; }
    .tab.active { color: #333; border-bottom-color: #ff6a00; background: #fff; font-weight: 600; }
    .tab-count { font-size: 11px; color: #999; margin-left: 4px; }
    .content { flex: 1; overflow-y: auto; padding: 8px; }
    .content.hidden { display: none; }
    .summary { display: flex; gap: 12px; padding: 8px 12px; background: #fff7e6; border-bottom: 1px solid #ffe0b0; font-size: 12px; }
    .summary span { color: #d35400; font-weight: 600; }
    .card { display: flex; gap: 10px; padding: 10px; border-bottom: 1px solid #f0f0f0; cursor: pointer; transition: background 0.15s; }
    .card:hover { background: #fafafa; }
    .card-img { width: 60px; height: 60px; border-radius: 6px; object-fit: cover; flex-shrink: 0; background: #f5f5f5; }
    .card-info { flex: 1; min-width: 0; }
    .card-title { font-size: 13px; color: #333; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-all; }
    .card-meta { margin-top: 4px; font-size: 11px; color: #999; }
    .card-price { font-size: 14px; color: #d35400; font-weight: 700; }
    .card-orig { font-size: 11px; color: #bbb; text-decoration: line-through; margin-left: 6px; }
    .card-tags { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; }
    .tag { font-size: 10px; padding: 1px 5px; border-radius: 3px; background: #f5f5f5; color: #666; border: 1px solid #e0e0e0; }
    .tag.promo { background: #fff0e0; color: #d35400; border-color: #ffd699; }
    .empty { text-align: center; color: #999; padding: 40px 20px; font-size: 13px; }
  </style>
</head>
<body>
  <div class="tabs">
    <div class="tab active" data-tab="cart">购物车<span class="tab-count" id="cart-count"></span></div>
    <div class="tab" data-tab="collected">已采集<span class="tab-count" id="collected-count"></span></div>
  </div>

  <div class="summary" id="summary"></div>

  <div class="content" id="cart-content"></div>
  <div class="content hidden" id="collected-content"></div>

  <script src="popup.js"></script>
</body>
</html>
